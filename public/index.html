<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seya Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #1a1a1a; color: white; padding: 16px 20px; font-size: 18px; font-weight: bold; }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: #666; }
    .upload-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .upload-box { flex: 1; border: 2px dashed #ddd; border-radius: 8px; padding: 16px 8px; text-align: center; cursor: pointer; }
    .upload-box input { display: none; }
    .upload-box .icon { font-size: 28px; margin-bottom: 4px; }
    .upload-box .label { font-size: 11px; color: #666; line-height: 1.3; }
    .upload-box img { width: 100%; border-radius: 4px; margin-top: 8px; display: none; max-height: 80px; object-fit: cover; }
    .upload-box.has-image { border-color: #34c759; border-style: solid; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; }
    .btn-primary { background: #1a1a1a; color: white; }
    .btn-success { background: #34c759; color: white; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .result-area { display: none; }
    .result-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .result-table th { background: #f5f5f5; padding: 8px; text-align: left; font-weight: 600; }
    .result-table td { padding: 8px; border-bottom: 1px solid #eee; }
    .summary-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 15px; }
    .summary-row:last-child { border-bottom: none; }
    .summary-label { color: #666; }
    .summary-value { font-weight: bold; }
    .total-row { color: #34c759; font-size: 17px; }
    .period-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 14px; }
    .status-msg { padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; display: none; margin-top: 12px; }
    .status-loading { background: #fff3cd; color: #856404; }
    .status-success { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }
    .ai-report { font-size: 14px; line-height: 1.8; color: #333; white-space: pre-wrap; }
    .ai-report-loading { text-align: center; color: #999; padding: 16px 0; font-size: 14px; }
    .coverage-stat { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #333; }
    .coverage-stat span { color: #34c759; }
    .coverage-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .coverage-tag { font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: 500; }
    .coverage-tag.missing    { background: #f8d7da; color: #721c24; }
    .coverage-tag.incomplete { background: #fff3cd; color: #856404; }
    .coverage-tag.complete   { background: #d4edda; color: #155724; }
    .editable { cursor: text; border-bottom: 1px dashed #bbb; display: inline-block; min-width: 16px; }
    .editable:hover { border-bottom-color: #34c759; }
    .date-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; }
    .date-row label { font-size: 13px; color: #666; white-space: nowrap; }
    .date-row input[type="date"] { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 8px 10px; font-size: 14px; color: #333; }
    .section-title { font-size: 13px; font-weight: 600; color: #666; margin: 16px 0 8px; }
    .cost-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cost-table th { background: #f5f5f5; padding: 7px 8px; text-align: left; font-weight: 600; color: #555; }
    .cost-table td { padding: 7px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .cost-table tr:last-child td { border-bottom: none; }
    .unit-cost-cell { color: #34c759; font-weight: bold; }
    .formula-cell { font-size: 11px; color: #999; max-width: 160px; word-break: break-all; }
    .btn-sm { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; background: #1a1a1a; color: white; margin-top: 12px; width: 100%; }
  </style>
</head>
<body>
  <div class="header">☕ Seya Manager</div>
  <div class="container">
    <div class="card" id="coverageCard">
      <h2>📅 數據覆蓋狀況</h2>
      <div id="coverageStat" class="coverage-stat" style="color:#999;font-weight:normal">載入中...</div>
      <details id="coverageDetails" style="margin-top:10px">
        <summary style="cursor:pointer;font-size:13px;color:#856404;font-weight:600;list-style:none;display:flex;align-items:center;gap:4px">
          ⚠️ 待補齊日期
        </summary>
        <div id="coverageList" class="coverage-list" style="margin-top:10px"></div>
      </details>
    </div>

    <div class="card">
      <h2>📥 匯出數據</h2>
      <div class="date-row">
        <label>開始</label>
        <input type="date" id="exportStart">
        <label>結束</label>
        <input type="date" id="exportEnd">
      </div>
      <button class="btn btn-primary" onclick="exportCSV()">⬇ 下載 Excel</button>
    </div>

    <div class="card">
      <h2>📷 上傳今日三張明細</h2>
      <div class="upload-row">
        <div class="upload-box" id="box1" onclick="document.getElementById('file1').click()">
          <input type="file" id="file1" accept="image/*" >
          <div class="icon">📊</div>
          <div class="label">產品銷售<br>排行表</div>
          <img id="prev1">
        </div>
        <div class="upload-box" id="box2" onclick="document.getElementById('file2').click()">
          <input type="file" id="file2" accept="image/*" >
          <div class="icon">💳</div>
          <div class="label">結帳<br>明細</div>
          <img id="prev2">
        </div>
        <div class="upload-box" id="box3" onclick="document.getElementById('file3').click()">
          <input type="file" id="file3" accept="image/*" >
          <div class="icon">🕐</div>
          <div class="label">結帳<br>總表</div>
          <img id="prev3">
        </div>
      </div>
      <button class="btn btn-primary" id="analyzeBtn" disabled onclick="analyzeImages()">解析今日明細</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>
    <div class="card result-area" id="resultArea">
      <h2>📊 產品銷售排行</h2>
      <table class="result-table">
        <thead><tr><th>排行</th><th>品項</th><th>數量</th><th>營收</th></tr></thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>
    <div class="card result-area" id="summaryArea">
      <h2>💰 收款摘要</h2>
      <div id="summaryBody"></div>
    </div>
    <div class="card result-area" id="periodArea">
      <h2>🕐 時段營業額</h2>
      <div id="periodBody"></div>
      <button class="btn btn-success" id="saveBtn" onclick="saveData()">確認並儲存</button>
    </div>

    <div class="card" id="reportArea" style="display:none">
      <h2>📈 當日毛利報表</h2>
      <div id="reportBody"></div>
      <h2 style="margin-top:16px;font-size:14px;color:#666">品項毛利排行</h2>
      <table class="result-table" style="margin-top:8px">
        <thead><tr><th>排行</th><th>品項</th><th>數量</th><th>毛利</th></tr></thead>
        <tbody id="reportItems"></tbody>
      </table>
    </div>

    <div class="card" id="aiReportArea" style="display:none">
      <h2>🤖 AI 營業報告</h2>
      <div id="aiReportBody"><div class="ai-report-loading">⏳ 報告生成中...</div></div>
    </div>

    <div style="text-align:center;padding:8px 0 24px;display:flex;justify-content:center;gap:20px">
      <a href="/cost.html" style="color:#999;font-size:14px;text-decoration:none;">⚙️ 成本管理</a>
      <a href="/weekly.html" style="color:#999;font-size:14px;text-decoration:none;">📊 週報</a>
      <a href="/monthly.html" style="color:#999;font-size:14px;text-decoration:none;">📈 月報</a>
    </div>
  </div>
  <script>
    let parsedData = null;
    let uploadedFiles = {};
    ['1','2','3'].forEach(n => {
      document.getElementById('file'+n).addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        uploadedFiles[n] = file;
        const reader = new FileReader();
        reader.onload = function(ev) {
          const img = document.getElementById('prev'+n);
          img.src = ev.target.result;
          img.style.display = 'block';
          document.getElementById('box'+n).classList.add('has-image');
        };
        reader.readAsDataURL(file);
        checkReady();
      });
    });
    function checkReady() {
      const count = Object.keys(uploadedFiles).length;
      document.getElementById('analyzeBtn').disabled = count === 0;
      if (count > 0 && count < 3) {
        document.getElementById('analyzeBtn').textContent = '解析今日明細（' + count + '/3 張）';
      } else if (count === 3) {
        document.getElementById('analyzeBtn').textContent = '解析今日明細（3 張齊全）';
      }
    }
    async function compressImage(file) {
      return file;
    }

    async function analyzeImages() {
      showStatus('loading', '⏳ 壓縮圖片中...');
      document.getElementById('analyzeBtn').disabled = true;
      const formData = new FormData();
      for (const n of Object.keys(uploadedFiles)) {
        const compressed = await compressImage(uploadedFiles[n]);
        formData.append('images', compressed);
        formData.append('types', ['sales_ranking','payment_detail','period_summary'][parseInt(n)-1]);
      }
      showStatus('loading', '⏳ Claude 正在解析圖片，請稍候...');
      try {
        const res = await fetch('/api/analyze-multi', { method: 'POST', body: formData });
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        parsedData = result.data;
        parsedData.is_complete = Object.keys(uploadedFiles).length >= 3;
        displayResult(parsedData);
        if (parsedData.parse_errors) {
          const failed = Object.keys(parsedData.parse_errors).join('、');
          showStatus('error', '⚠️ 部分圖片解析失敗（' + failed + '），其餘數據已顯示，請手動補填或重新上傳失敗的圖片');
        } else {
          showStatus('success', '✅ 解析完成，請確認後儲存');
        }
      } catch (err) {
        showStatus('error', '❌ 解析失敗：' + err.message);
        document.getElementById('analyzeBtn').disabled = false;
      }
    }
    function editable(field, idx, key, val) {
      const attrs = 'class="editable" data-field="' + field + '"' +
        (idx !== null ? ' data-idx="' + idx + '"' : '') +
        (key  !== null ? ' data-key="' + key + '"'  : '');
      return '<span ' + attrs + '>' + val + '</span>';
    }

    function makeEditable(span) {
      if (span.querySelector('input')) return;
      const val = span.textContent;
      const input = document.createElement('input');
      input.value = val;
      input.style.cssText = 'width:' + Math.max(span.offsetWidth + 20, 60) + 'px;border:none;border-bottom:2px solid #34c759;outline:none;font-size:inherit;font-weight:inherit;color:inherit;background:transparent;padding:0;';
      span.textContent = '';
      span.appendChild(input);
      input.focus();
      input.select();

      function commit() {
        const newVal = input.value.trim();
        span.textContent = newVal || val;
        const field = span.dataset.field;
        const idx   = parseInt(span.dataset.idx);
        const key   = span.dataset.key;
        if (field === 'items') {
          if (key === 'qty_sold') parsedData.items[idx].qty_sold = parseInt(newVal) || 0;
          else parsedData.items[idx].product_name = newVal || parsedData.items[idx].product_name;
        } else if (field === 'periods') {
          parsedData.periods[idx].amount = parseInt(newVal) || 0;
        } else {
          parsedData[field] = parseInt(newVal) || 0;
          if (field !== 'total_revenue') {
            parsedData.total_revenue = (parsedData.cash_amount || 0) + (parsedData.card_amount || 0) + (parsedData.other_amount || 0);
            const totalEl = document.querySelector('[data-field="total_revenue"]');
            if (totalEl) totalEl.textContent = parsedData.total_revenue;
          }
        }
      }
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
    }

    function displayResult(data) {
      document.getElementById('itemsBody').innerHTML = data.items.map((item, i) =>
        '<tr><td>'+(i+1)+'</td>' +
        '<td>' + editable('items', i, 'product_name', item.product_name) + '</td>' +
        '<td>' + editable('items', i, 'qty_sold', item.qty_sold) + '</td>' +
        '<td>$'+(item.revenue||'-')+'</td></tr>'
      ).join('');

      document.getElementById('summaryBody').innerHTML =
        '<div class="summary-row"><span class="summary-label">日期</span><span class="summary-value">'+(data.sale_date||'-')+'</span></div>'+
        '<div class="summary-row"><span class="summary-label">現金</span><span class="summary-value">$' + editable('cash_amount', null, null, data.cash_amount||0) + '</span></div>'+
        '<div class="summary-row"><span class="summary-label">信用卡</span><span class="summary-value">$' + editable('card_amount', null, null, data.card_amount||0) + '</span></div>'+
        '<div class="summary-row"><span class="summary-label">其他</span><span class="summary-value">$' + editable('other_amount', null, null, data.other_amount||0) + '</span></div>'+
        '<div class="summary-row total-row"><span class="summary-label">總營業額</span><span class="summary-value">$' + editable('total_revenue', null, null, data.total_revenue||0) + '</span></div>';

      if (data.periods && data.periods.length > 0) {
        document.getElementById('periodBody').innerHTML = data.periods.map((p, i) =>
          '<div class="period-row"><span>'+p.time+'</span><span>$' + editable('periods', i, 'amount', p.amount) + '</span></div>'
        ).join('');
      } else {
        document.getElementById('periodBody').innerHTML = '<div class="period-row"><span style="color:#999">無時段資料</span></div>';
      }

      document.querySelectorAll('.result-area').forEach(el => el.style.display = 'block');
      document.querySelectorAll('.editable').forEach(span => {
        span.addEventListener('click', function() { makeEditable(span); });
      });
    }
    async function saveData() {
      if (!parsedData) return;
      showStatus('loading', '⏳ 儲存中...');
      document.getElementById('saveBtn').disabled = true;
      try {
        const res = await fetch('/api/save-daily', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(parsedData)
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        showStatus('success', '✅ 資料已儲存');
        await loadDailyReport(parsedData.sale_date, parsedData.periods);
      } catch (err) {
        showStatus('error', '❌ 儲存失敗：' + err.message);
        document.getElementById('saveBtn').disabled = false;
      }
    }

    async function loadDailyReport(date, periods) {
      try {
        const res = await fetch('/api/daily-report/' + date);
        const result = await res.json();
        if (!result.success) return;
        const d = result.data;
        document.getElementById('reportArea').style.display = 'block';
        document.getElementById('reportBody').innerHTML =
          '<div class="summary-row"><span class="summary-label">實收營業額</span><span class="summary-value">$' + d.total_revenue + '</span></div>' +
          '<div class="summary-row"><span class="summary-label">總成本</span><span class="summary-value">$' + d.total_cost + '</span></div>' +
          '<div class="summary-row total-row"><span class="summary-label">毛利</span><span class="summary-value">$' + d.total_gross_profit + '</span></div>' +
          '<div class="summary-row total-row"><span class="summary-label">毛利率</span><span class="summary-value">' + d.margin_pct + '%</span></div>';
        document.getElementById('reportItems').innerHTML = d.items.map((item, i) =>
          '<tr><td>' + (i+1) + '</td><td>' + item.product_name + '</td><td>' + item.qty_sold + '</td><td>$' + (item.gross_profit || 0) + '</td></tr>'
        ).join('');

        // 顯示 AI 報告區塊並呼叫 API
        document.getElementById('aiReportArea').style.display = 'block';
        document.getElementById('aiReportBody').innerHTML = '<div class="ai-report-loading">⏳ 報告生成中...</div>';
        try {
          const aiRes = await fetch('/api/daily-ai-report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              sale_date: d.sale_date,
              total_revenue: d.total_revenue,
              margin_pct: d.margin_pct,
              items: d.items,
              periods: periods || []
            })
          });
          const aiResult = await aiRes.json();
          if (aiResult.success) {
            document.getElementById('aiReportBody').innerHTML = '<div class="ai-report">' + aiResult.report.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') + '</div>';
          } else {
            document.getElementById('aiReportBody').innerHTML = '<div class="ai-report-loading">❌ 報告生成失敗</div>';
          }
        } catch(e) {
          document.getElementById('aiReportBody').innerHTML = '<div class="ai-report-loading">❌ 報告生成失敗</div>';
        }
      } catch(e) {}
    }
    function showStatus(type, msg) {
      const el = document.getElementById('statusMsg');
      el.className = 'status-msg status-' + type;
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function markNonBusinessDay(date) {
      if (!confirm('確認將 ' + date + ' 標記為非營業日？')) return;
      try {
        const res = await fetch('/api/non-business-day', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date })
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        loadCoverage();
      } catch (e) { alert('標記失敗：' + e.message); }
    }

    async function loadCoverage() {
      try {
        const res = await fetch('/api/data-coverage');
        const result = await res.json();
        if (!result.success) throw new Error(result.error);

        const dateMap = result.dateMap || {};
        const coveredDates = Object.keys(dateMap);
        if (coveredDates.length === 0) {
          document.getElementById('coverageStat').textContent = '尚無任何數據';
          return;
        }

        // 計算從最早日期到今天的所有日期
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const earliest = new Date(coveredDates.sort()[0]);
        const allDates = [];
        for (let d = new Date(earliest); d <= today; d.setDate(d.getDate() + 1)) {
          allDates.push(d.toISOString().slice(0, 10));
        }

        const complete    = allDates.filter(d => dateMap[d] === 'complete').length;
        const incomplete  = allDates.filter(d => dateMap[d] === 'incomplete').length;
        const nonBusiness = allDates.filter(d => dateMap[d] === 'non_business').length;
        const missing     = allDates.filter(d => !dateMap[d]).length;

        document.getElementById('coverageStat').innerHTML =
          '<span style="color:#155724">✅ 已完整 ' + complete + ' 天</span>　' +
          '<span style="color:#856404">⚠️ 不完整 ' + incomplete + ' 天</span>　' +
          '<span style="color:#721c24">❌ 缺少 ' + missing + ' 天</span>' +
          (nonBusiness > 0 ? '　<span style="color:#555">🚫 非營業日 ' + nonBusiness + ' 天</span>' : '');

        const needAttention = allDates.slice().reverse().filter(d => dateMap[d] === 'missing' || !dateMap[d] || dateMap[d] === 'incomplete');
        const details = document.getElementById('coverageDetails');
        if (needAttention.length === 0) {
          details.style.display = 'none';
        } else {
          details.style.display = '';
          document.getElementById('coverageList').innerHTML = needAttention.map(d => {
            if (dateMap[d] === 'incomplete') {
              return '<span class="coverage-tag incomplete">' + d + ' ⚠️</span>';
            }
            return '<span class="coverage-tag missing" style="display:inline-flex;align-items:center;gap:4px">' +
              d +
              '<button onclick="markNonBusinessDay(\'' + d + '\')" style="background:#721c24;color:white;border:none;border-radius:4px;font-size:10px;padding:1px 5px;cursor:pointer;white-space:nowrap">非營業日</button>' +
              '</span>';
          }).join('');
        }

      } catch (e) {
        document.getElementById('coverageStat').textContent = '載入失敗：' + e.message;
      }
    }

    // 預設日期：本月第一天 ～ 今天
    (function() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('exportEnd').value = yyyy + '-' + mm + '-' + dd;
      document.getElementById('exportStart').value = yyyy + '-' + mm + '-01';
    })();

    function exportCSV() {
      const start = document.getElementById('exportStart').value;
      const end   = document.getElementById('exportEnd').value;
      if (!start || !end) { alert('請選擇日期範圍'); return; }
      if (start > end)    { alert('開始日期不能晚於結束日期'); return; }
      const url = '/api/export-csv?start_date=' + start + '&end_date=' + end;
      const a = document.createElement('a');
      a.href = url;
      a.download = 'seya-sales-' + start + '-' + end + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    loadCoverage();
  </script>
</body>
</html>
