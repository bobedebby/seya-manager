<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成本管理 — Seya Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; color: #333; }
    .header { background: #1a1a1a; color: white; padding: 16px 20px; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 12px; }
    .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: #666; }
    .section-title { font-size: 13px; font-weight: 600; color: #666; margin: 16px 0 8px; }
    .cost-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .cost-table th { background: #f5f5f5; padding: 7px 8px; text-align: left; font-weight: 600; color: #555; }
    .cost-table td { padding: 7px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
    .cost-table tr:last-child td { border-bottom: none; }
    .unit-cost-cell { color: #34c759; font-weight: bold; }
    .formula-cell { font-size: 11px; color: #999; max-width: 160px; word-break: break-all; }
    .btn-sm { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; background: #1a1a1a; color: white; margin-top: 12px; width: 100%; }
    .btn-sm:disabled { background: #ccc; cursor: not-allowed; }
    .editable { cursor: text; border-bottom: 1px dashed #bbb; display: inline-block; min-width: 16px; }
    .editable:hover { border-bottom-color: #34c759; }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="location.href='/'">‹</button>
    ⚙️ 成本管理
  </div>
  <div class="container">
    <div class="card">
      <h2>⚙️ 成本管理</h2>
      <div class="section-title">原物料列表</div>
      <table class="cost-table">
        <thead><tr><th>編號</th><th>名稱</th><th>進貨規格</th><th>單位成本</th></tr></thead>
        <tbody id="ingredientsBody"><tr><td colspan="4" style="color:#999;text-align:center;padding:12px">載入中...</td></tr></tbody>
      </table>
      <button class="btn-sm" onclick="recalculateCosts()" id="recalcBtn">🔄 重新計算所有品項成本</button>
      <div class="section-title" style="margin-top:20px">品項成本列表</div>
      <table class="cost-table">
        <thead><tr><th>品項</th><th>分類</th><th>成本組合</th><th>單杯成本</th><th>售價</th></tr></thead>
        <tbody id="productsCostBody"><tr><td colspan="5" style="color:#999;text-align:center;padding:12px">載入中...</td></tr></tbody>
      </table>
    </div>
  </div>
  <script>
    async function loadIngredients() {
      try {
        const res    = await fetch('/api/ingredients');
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        const rows = result.data.map(ing => {
          const ucVal = ing.unit_cost != null ? ing.unit_cost : '-';
          return '<tr>' +
            '<td style="color:#999">' + ing.id + '</td>' +
            '<td><strong>' + (ing.label || '-') + '</strong>' +
              (ing.component ? '<br><span style="font-size:11px;color:#999">' + ing.component + '</span>' : '') +
            '</td>' +
            '<td style="color:#666;font-size:12px">' + (ing.purchase_spec || '-') + '</td>' +
            '<td class="unit-cost-cell">' +
              '<span class="editable" data-ing-id="' + ing.id + '">' + ucVal + '</span>' +
            '</td>' +
          '</tr>';
        }).join('');
        document.getElementById('ingredientsBody').innerHTML = rows || '<tr><td colspan="4" style="color:#999;text-align:center">尚無資料</td></tr>';
        document.querySelectorAll('#ingredientsBody .editable').forEach(span => {
          span.addEventListener('click', function() { makeIngEditable(span); });
        });
      } catch (e) {
        document.getElementById('ingredientsBody').innerHTML = '<tr><td colspan="4" style="color:#c00">載入失敗：' + e.message + '</td></tr>';
      }
    }

    function makeIngEditable(span) {
      if (span.querySelector('input')) return;
      const val   = span.textContent;
      const ingId = span.dataset.ingId;
      const input = document.createElement('input');
      input.value = val === '-' ? '' : val;
      input.type  = 'number';
      input.style.cssText = 'width:60px;border:none;border-bottom:2px solid #34c759;outline:none;font-size:inherit;font-weight:inherit;color:inherit;background:transparent;padding:0;';
      span.textContent = '';
      span.appendChild(input);
      input.focus();
      input.select();

      async function commit() {
        const newVal = parseFloat(input.value);
        if (isNaN(newVal) || newVal < 0) { span.textContent = val; return; }
        span.textContent = '...';
        try {
          const res    = await fetch('/api/ingredients/' + ingId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ unit_cost: newVal })
          });
          const result = await res.json();
          if (!result.success) throw new Error(result.error);
          span.textContent = result.unit_cost;
        } catch (e) {
          span.textContent = val;
          alert('更新失敗：' + e.message);
        }
      }
      input.addEventListener('blur', commit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
    }

    async function recalculateCosts() {
      const btn = document.getElementById('recalcBtn');
      btn.disabled = true;
      btn.textContent = '⏳ 計算中...';
      try {
        const res    = await fetch('/api/recalculate-costs', { method: 'POST' });
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        btn.textContent = '✅ 已更新 ' + result.updated + ' 個品項';
        await loadProductsCost();
      } catch (e) {
        btn.textContent = '❌ 失敗：' + e.message;
      } finally {
        setTimeout(() => { btn.disabled = false; btn.textContent = '🔄 重新計算所有品項成本'; }, 3000);
      }
    }

    async function loadProductsCost() {
      try {
        const res    = await fetch('/api/products-master');
        const result = await res.json();
        if (!result.success) throw new Error(result.error);
        const rows = result.data.map(p => {
          let formulaDisplay = '-';
          if (p.cost_formula) {
            try {
              const f = JSON.parse(p.cost_formula);
              formulaDisplay = f.map(i => i.id + '×' + i.amount).join(', ');
            } catch (_) { formulaDisplay = p.cost_formula; }
          }
          return '<tr>' +
            '<td><strong>' + p.name + '</strong></td>' +
            '<td style="color:#999">' + (p.category || '-') + '</td>' +
            '<td class="formula-cell">' + formulaDisplay + '</td>' +
            '<td class="unit-cost-cell">$' + (p.unit_cost != null ? p.unit_cost : '-') + '</td>' +
            '<td>$' + (p.sell_price != null ? p.sell_price : '-') + '</td>' +
          '</tr>';
        }).join('');
        document.getElementById('productsCostBody').innerHTML = rows || '<tr><td colspan="5" style="color:#999;text-align:center">尚無資料</td></tr>';
      } catch (e) {
        document.getElementById('productsCostBody').innerHTML = '<tr><td colspan="5" style="color:#c00">載入失敗：' + e.message + '</td></tr>';
      }
    }

    loadIngredients();
    loadProductsCost();
  </script>
</body>
</html>
